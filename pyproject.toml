[project]
name = "will-you-buy-an-ev"
version = "0.1.0"
description = "An end-to-end machine learning project for predicting EV purchase likelihood, including data preprocessing, feature engineering, model training, and evaluation."
readme = "README.md"
authors = [
    { name = "Corey Michaud", email = "cor3y.michaud@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "kagglehub>=1.0.2",
    "kaleido>=1.4.0",
    "lightgbm>=4.7.0",
    "nbformat>=5.11.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
    "wandb>=0.30.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ruff>=0.16.6",
]
